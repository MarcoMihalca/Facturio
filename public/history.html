<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facturio — Istoric Facturi</title>
    <meta name="description" content="Vizualizează și gestionează facturile generate anterior.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="/js/theme.js"></script>
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/history.css">
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="grid-pattern"></div>

    <!-- Navbar Placeholder -->
    <div id="navbar-placeholder"></div>
    <script src="/js/navbar.js"></script>

    <!-- Main Content -->
    <main class="main">
        <div class="page-header">
            <h2>Istoric Facturi</h2>
            <p>Toate facturile generate, într-un singur loc</p>
        </div>

        <!-- Filters & Search -->
        <div class="card filters-card">
            <div class="filters-grid">
                <div class="filter-group">
                    <label for="searchClient">Căutare client</label>
                    <div class="input-with-icon">
                        <span class="input-icon">🔍</span>
                        <input type="text" id="searchClient" placeholder="Nume client...">
                    </div>
                </div>
                <div class="filter-group">
                    <label for="filterDate">Perioadă</label>
                    <select id="filterDate">
                        <option value="all">Toate facturile</option>
                        <option value="today">Astăzi</option>
                        <option value="thisMonth">Luna aceasta</option>
                        <option value="last3Months">Ultimele 3 luni</option>
                        <option value="last6Months">Ultimele 6 luni</option>
                        <option value="thisYear">Anul acesta</option>
                        <option value="custom">Perioadă custom...</option>
                    </select>
                </div>
                <div class="filter-group" id="customDateGroup" style="display: none;">
                    <label>Interval Custom</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="date" id="startDate" title="De la">
                        <input type="date" id="endDate" title="Până la">
                    </div>
                </div>
                <div class="filter-group">
                    <label for="sortBy">Sortează după</label>
                    <select id="sortBy">
                        <option value="dateDesc">Dată (Cea mai recentă)</option>
                        <option value="dateAsc">Dată (Cea mai veche)</option>
                        <option value="totalDesc">Sumă (Mare → Mică)</option>
                        <option value="totalAsc">Sumă (Mică → Mare)</option>
                        <option value="clientAsc">Client (A-Z)</option>
                        <option value="statusLateFirst">Status (Întârziată întâi)</option>
                        <option value="statusOnTimeFirst">Status (În termen întâi)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-row">
            <div class="stat-card">
                <span class="stat-value" id="statTotal">0</span>
                <span class="stat-label">Facturi totale</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="statMonth">0</span>
                <span class="stat-label">Luna aceasta</span>
            </div>
            <div class="stat-card accent">
                <span class="stat-value" id="statSum">0 RON</span>
                <span class="stat-label">Valoare totală</span>
            </div>
        </div>

        <!-- Tabel facturi -->
        <div class="card" style="animation-delay: 0.15s">
            <div class="card-header">
                <div class="card-icon" style="background: rgba(99,102,241,0.15)">📋</div>
                <div class="card-header-text">
                    <h3>Facturi emise</h3>
                    <p id="invoiceCount">Se încarcă...</p>
                </div>
            </div>

            <div class="empty-state" id="emptyState" style="display:none">
                <div class="empty-icon">📭</div>
                <h3>Nicio factură încă</h3>
                <p>Creează prima ta factură pentru a o vedea aici</p>
                <a href="/invoice.html" class="btn-create">＋ Creează factură</a>
            </div>

            <div class="table-wrapper" id="tableWrapper">
                <table class="history-table" id="historyTable">
                    <thead>
                        <tr>
                            <th>Serie/Nr.</th>
                            <th>Client</th>
                            <th>Data</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Acțiuni</th>
                        </tr>
                    </thead>
                    <tbody id="invoiceRows">
                        <!-- Rânduri generate din JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="/js/history.js"></script>
</body>
</html>
